<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | The Odin Project</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body class="">
    <div class="div-main">
        <div class="div-title">
            <h1>Tic - Tac - Toe</h1>
            <p>by Marco to "The Odin Project"</p>
        </div>
        <button class="btn-modechange"><span class="material-symbols-outlined" fill="currentColor">dark_mode</span><span
                class="material-symbols-outlined" fill="currentColor">light_mode</span></button>
        <div class="div-start">
            <div class="div-player">
                <div>
                    <label>Player 1's name</label>
                    <input type="text" placeholder="Emma" id="input-1">

                </div>
                <div>
                    <label>Player 2's name</label>
                    <input type="text" placeholder="Marco" id="input-2">

                </div>
            </div>
            <div class="div-dashboard"></div>
            <button class="btn-start">START</button>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
