<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List | The Odin Project</title>
</head>

<body>
    <div class="overlay"></div>
    <h1>ANDO</h1>
    <button id="add-task-btn">Add task</button>
    <div class="div-task">
        <label><input type="checkbox" id="cbox1" value="first_checkbox" /></label><br />
    </div>
    <div class="div-create-class">
        <form action="">
            <label>Task name</label>
            <input type="text" id="task-input" placeholder="Ej: Do math homework...">
            <button type="button" id="done-btn" disabled>Done</button>
        </form>
    </div>
</body>

</html>
