<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather App | The Odin Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-blue-400 to-indigo-600 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center transition-colors duration-500">

    <div id="weather-card" class="glass w-full max-w-md rounded-3xl shadow-2xl p-8 text-white relative overflow-hidden">

        <div class="flex gap-2 mb-5">
            <input type="text" id="input-text" placeholder="Search city..."
                class="flex-1 p-3 rounded-xl bg-white/20 placeholder-white text-white outline-none focus:ring-2 focus:ring-white transition">

            <button id="btn-search" class="bg-white/20 hover:bg-white/30 px-4 rounded-xl transition">Search</button>

            <button id="btn-location" class="bg-white/20 hover:bg-white/30 px-4 rounded-xl transition">📍</button>
        </div>

        <h2 id="city-content" class="text-2xl font-semibold tracking-wide text-center mb-2"></h2>

        <div class="flex justify-center items-center gap-4 mb-4">
            <span id="weather-icon" class="text-6xl"></span>
            <p id="id-content" class="text-5xl font-bold"></p>
        </div>

        <div id="extra-info" class="flex justify-between text-sm bg-white/10 rounded-xl p-3 mb-6"></div>

        <h3 class="text-lg font-semibold mb-3 text-center" id="foretext">Forecast</h3>

        <div id="forecast" class="grid grid-cols-2 gap-3 text-sm"></div>

        <div class="text-center mt-8 text-xs text-white/70"> <a href="https://github.com/MarcoFm1/odin-exercise/tree/main/op-weather-app" target="_blank">by Marco</a></div>

    </div>
</body>

</html>
